<table mat-table [dataSource]="balancesDataSource()" matSort>
  <ng-container [matColumnDef]="BalanceColumns.date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let row"> {{ row[BalanceColumns.date] | DateTime }} </td>
  </ng-container>

  <ng-container [matColumnDef]="BalanceColumns.balance">
    <th mat-header-cell *matHeaderCellDef> Balance </th>
    <td mat-cell *matCellDef="let row"> {{ row[BalanceColumns.balance] | currency }} </td>
  </ng-container>

  <ng-container [matColumnDef]="BalanceColumns.isProjected">
    <th mat-header-cell *matHeaderCellDef> Is Projected </th>
    <td mat-cell *matCellDef="let row"> <div>{{ row[BalanceColumns.isProjected] | boolean }}</div> </td>
  </ng-container>

  <ng-container [matColumnDef]="BalanceColumns.transactions">
    <th mat-header-cell *matHeaderCellDef> See Transactions </th>
    <td mat-cell *matCellDef="let row">
      <button mat-icon-button [matMenuTriggerFor]="transactionsMenu" (click)="selectBalance(row)">
        <mat-icon>more_horiz</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedBalanceColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedBalanceColumns;" [ngClass]="{
    'bg-blue-100': row.isProjected === 'projected'
  }"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>

<mat-menu #transactionsMenu="matMenu" class="!max-w-max">
  <app-balance-on-day-table [balance]="selectedBalance()"></app-balance-on-day-table>
</mat-menu>
