<table mat-table [dataSource]="transactionsDataSource()" matSort>
  <ng-container [matColumnDef]="TransactionTableColumns.Date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let row"> {{row[TransactionTableColumns.Date]}} </td>
  </ng-container>

  <ng-container [matColumnDef]="TransactionTableColumns.Description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let row"> {{row[TransactionTableColumns.Description]}} </td>
  </ng-container>

  <ng-container [matColumnDef]="TransactionTableColumns.Amount">
    <th mat-header-cell *matHeaderCellDef> Amount </th>
    <td mat-cell *matCellDef="let row"> {{row[TransactionTableColumns.Amount]}} </td>
  </ng-container>

  <ng-container [matColumnDef]="TransactionTableColumns.RunningBalance">
    <th mat-header-cell *matHeaderCellDef> Running Balance </th>
    <td mat-cell *matCellDef="let row"> {{row[TransactionTableColumns.RunningBalance]}} </td>
  </ng-container>

  <ng-container [matColumnDef]="TransactionTableColumns.Account">
    <th mat-header-cell *matHeaderCellDef> Account </th>
    <td mat-cell *matCellDef="let row"> {{row[TransactionTableColumns.Account]}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedTransactionColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedTransactionColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
