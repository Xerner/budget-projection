<h2 mat-dialog-title>Inputs</h2>
<mat-dialog-content>
  <app-inputs></app-inputs>
</mat-dialog-content>
<mat-dialog-actions class="gap-3">
  <button mat-flat-button class="mt-2" (click)="onLogCacheClicked()">
    Log Cache
  </button>
  <button mat-flat-button class="mt-2" (click)="onBustCacheClicked()">
    Bust Cache
  </button>
  <button mat-flat-button class="mt-2" (click)="this.onFetchClicked()">
    Fetch All
  </button>
</mat-dialog-actions>
